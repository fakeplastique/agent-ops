services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: agent_ops
    ports: ["${PG_PUBLISH:-5432:5432}"] # a gate lane publishes on a random host port
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d agent_ops"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7
    ports: ["${REDIS_PUBLISH:-6379:6379}"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Optional S3-compatible store for attachments (profile storage): `docker compose --profile storage up -d garage`,
  # then scripts/garage-init.sh. Without it the API keeps files on local disk (FILE_STORAGE=local).
  garage:
    profiles: ["storage"]
    image: dxflrs/garage:v1.0.1
    volumes:
      - ./scripts/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    ports: ["${GARAGE_PUBLISH:-3900:3900}"]

  # Production images (profile prod): the gate builds them and checks non-root + health.
  api:
    profiles: ["prod"]
    build: { context: ., dockerfile: backend/Dockerfile } # repo root: the image carries scripts/migrate.sh
    environment:
      DATABASE_URL: postgresql://app_rt:app_rt@postgres:5432/agent_ops
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      retries: 30
  # The same image as the api, running the arq worker (outbox relay, timeouts, webhooks, Telegram, analytics).
  worker:
    profiles: ["prod"]
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["arq", "app.worker.settings.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql://app_rt:app_rt@postgres:5432/agent_ops
      WORKER_DATABASE_URL: postgresql://app_worker:app_worker@postgres:5432/agent_ops # needs APP_WORKER_PASSWORD at migrate time
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.settings.WorkerSettings"]
      interval: 2s
      retries: 30
  web:
    profiles: ["prod"]
    build:
      context: ./frontend
      args: { API_ORIGIN: "http://api:8000", NEXT_PUBLIC_WS_ORIGIN: "${NEXT_PUBLIC_WS_ORIGIN:-}" }
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      retries: 30

volumes:
  garage-data:
