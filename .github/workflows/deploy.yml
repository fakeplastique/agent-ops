name: deploy
# Runs only after the ci gate passed on a push to main; PRs and branches never reach it.
# Migrations run inside Railway as the api service's pre-deploy command (railway.json), so the database stays private.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }} # project token, scoped to one environment
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # the commit that passed, not whatever main is now
      - run: npm i -g @railway/cli
      # api first: its pre-deploy migration must finish (additive schema) before web rolls out.
      - run: railway up --service api --ci # repo root, so railway.json and backend/Dockerfile apply
      - run: railway up frontend --service web --ci
