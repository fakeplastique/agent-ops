name: deploy
# Runs only after the ci gate passed on a push to main; PRs and branches never reach it.
# Migrations run inside Railway as the api service's pre-deploy command (set on the service, not in a file), so the database stays private.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }} # project token, scoped to one environment
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # the commit that passed, not whatever main is now
      - run: npm i -g @railway/cli
      # api first. `railway up --ci` returns after the build, not after the pre-deploy migration, so web may
      # roll out on the old schema: safe only because migrations are additive (expand then contract, D9).
      - run: railway up --service api --ci # repo root: backend/Dockerfile needs scripts/
      - run: railway up --service web --ci
        working-directory: frontend # `railway up <path>` fails with "prefix not found"; cwd is the upload root
